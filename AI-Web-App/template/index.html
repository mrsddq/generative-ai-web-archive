<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Translator</title>
</head>
<body>
    <div class="container">
        <h1>Translation service</h1>
        <div>Enter the text you wish to translate, choose the language, and click Translate!</div>
        {% if error %}
        <div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
        {% endif %}
        <div>
            <form method="POST">
                <div class="form-group">
                    <label for="text">Text</label>
                    <textarea id="text" name="text" cols="20" rows="10" class="form-control" required>{{ request.form.get('text', '') }}</textarea>
                </div>
                <div class="form-group">
                    <label for="language">Language:</label>
                    <select id="language" name="language" class="form-control">
                        {% for code, label in [('en', 'English'), ('it', 'Italian'), ('ja', 'Japanese'), ('ru', 'Russian'), ('de', 'German')] %}
                        <option value="{{ code }}"{% if request.form.get('language', 'en') == code %} selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn btn-success">Translate!</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
